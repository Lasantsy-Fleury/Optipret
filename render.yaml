services:
  - type: web
    name: optipret-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: optipret-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_HOST
        value: ${RENDER_EXTERNAL_HOSTNAME}

databases:
  - name: optipret-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
